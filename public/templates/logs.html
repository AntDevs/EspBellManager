<!-- Template: logs.html (System boot.log & Microdot Debugger) -->
<div class="space-y-6 animate-fadeIn">
  <div class="bg-slate-900 rounded-3xl border border-slate-800 p-6 sm:p-8 shadow-2xl space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold mb-2">
          <span>📟 UART & Microdot Boot Logs</span>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Журнал событий устройства (boot.log)</h2>
        <p class="text-slate-400 text-xs sm:text-sm mt-1">
          Кольцевой буфер сообщений ядра ESP32-S3, сетевых вызовов Microdot и драйвера I2S DMA.
        </p>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-refresh-logs" data-action="refreshLogs" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors">
          🔄 Обновить
        </button>
        <button id="btn-clear-logs" data-action="clearLogs" class="px-4 py-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 text-rose-300 font-semibold text-xs border border-rose-800/60 transition-colors">
          🗑️ Очистить буфер
        </button>
      </div>
    </div>

    <!-- Terminal Box -->
    <div class="bg-slate-950 rounded-2xl border border-slate-800 p-4 font-mono text-xs text-slate-300 space-y-1 max-h-[500px] overflow-y-auto" id="tpl-logs-container">
      <!-- Log rows injected here -->
      <div class="text-slate-500 text-center py-4">Загрузка журнала сообщений...</div>
    </div>
  </div>
</div>
